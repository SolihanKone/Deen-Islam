name: deen_connect
description: Deen Islam — Quran, prayer times, duas, and qibla for Muslims worldwide.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  audio_service: ^0.18.16
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^13.0.4
  flutter_compass: ^0.8.1
  intl: ^0.20.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  permission_handler: ^11.4.0
  equatable: ^2.0.7
  go_router: ^14.8.1
  scrollable_positioned_list: ^0.3.8
  collection: ^1.19.1
  path_provider: ^2.1.5
  flutter_timezone: ^4.1.0
  quran: ^1.3.3
  qcf_quran: ^0.0.5
  flutter_tts: ^4.2.5
  adhan_dart: ^2.0.1
  sherpa_onnx: ^1.13.7
  archive: ^4.2.0
  path: ^1.9.1
  hijri: ^3.0.0
  lat_lng_to_timezone: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 23
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/duas.json
    - assets/tasbeeh.json
    - assets/names_of_allah.json
    - assets/mecca.png
    - assets/mushaf/pages/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
